gin:0 0 8px}.tile p{color:#afbdcf;font-size:11px;line-height:1.8;margin:5px 0}.tile audio{width:100%;height:35px;margin-top:10px}.pending{color:#90a0b6;font-size:12px}.checker{background-color:#273344!important;background-image:linear-gradient(45deg,#36465a 25%,transparent 25%),linear-gradient(-45deg,#36465a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#36465a 75%),linear-gradient(-45deg,transparent 75%,#36465a 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.section-title{font-size:23px;letter-spacing:2px;margin:5px 0 12px}.description{font-size:13px;color:#bdc7d5;line-height:1.9}.fx-layout{display:grid;grid-template-columns:1fr 260px;gap:20px}.fx-list{display:flex;flex-direction:column;gap:12px}.fx-stage{background:#111f31;border:1px solid #e9be7244}.fx-stage canvas{width:100%;height:auto;display:block}.layer-stage{position:relative;aspect-ratio:16/9;background:#17273c;border:1px solid #e9be7244;overflow:hidden}.layer-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.layers{display:flex;gap:20px;margin:15px 0;flex-wrap:wrap;font-size:13px}.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:26px;font-size:12px}.status{color:#e9be72} @media(max-width:850px){.layout{grid-template-columns:1fr}.shots{flex-direction:row;overflow-x:auto}.shots button{min-width:130px}.fx-layout{grid-template-columns:1fr}h1{font-size:26px}main{padding:20px 4vw}}
