<!doctype html><meta charset="utf-8"><title>更迭 · 画质增强审片</title><style>body{background:#081321;color:#ead6a1;font-family:system-ui;margin:20px}button{padding:10px;margin:4px}video{width:96vw;max-height:83vh}input{width:85vw}</style><h2>更迭 · 画质增强审片</h2><nav id="nav"></nav><div><button id="play">播放 / 暂停</button><button id="normal">正常速度</button><button id="half">半速</button><button id="prev">上一帧</button><button id="next">下一帧</button><output id="info"></output></div><video id="v" controls muted playsinline loop></video><br><input id="seek" type="range" min="0" max="1" step="0.033333"><script>
const v=document.querySelector('video'),info=document.querySelector('#info'),seek=document.querySelector('#seek');let selected='';
const revision='69d36e7a161dea4d';
function loadVideo(file,name,audible=false){selected=name;v.pause();v.playbackRate=1;v.muted=!audible;v.src=file+'?v='+revision;v.play().catch(()=>{});}
let fixed=document.createElement('button');fixed.textContent='火光 · 采帧修复试片';fixed.onclick=()=>loadVideo('输出/画质增强/4K火光-采帧修复验证.mp4','火光 · 采帧修复试片',true);nav.append(fixed);

for(const [id,name] of [['08','FAST'],['01','火光'],['10','飞船']]){let b=document.createElement('button');b.textContent=name+' · 四版对比';b.onclick=()=>{loadVideo('输出/画质增强/'+id+'-四版画质对比.mp4',name)};nav.append(b)}
for(const [id,name] of [['01','火光'],['03','知识'],['05','金字塔'],['07','蒸汽'],['08','FAST'],['10','太空']]){let b=document.createElement('button');b.textContent=name+' · 选定版';b.onclick=()=>{loadVideo('ai-enhanced-4k/'+id+'.mp4',name)};nav.append(b)}
for(const [name,file] of [['整片 · 4K','更迭-90秒混合宣传片-4K.mp4'],['整片 · 1080P','更迭-90秒混合宣传片.mp4'],['转场 · 4K','TransitionReel.mp4']]){let b=document.createElement('button');b.textContent=name;b.onclick=()=>{loadVideo('输出/'+file,name,true)};nav.append(b)}
for(const [id,name] of [['02','学习科技'],['04','专利收益'],['06','争取奇观'],['09','最终挑战'],['11','片尾']]){let b=document.createElement('button');b.textContent=name+' · 三维4K';b.onclick=()=>{loadVideo('输出/Shot'+id+'.mp4',name,true)};nav.append(b)}
play.onclick=()=>v.paused?v.play():v.pause();normal.onclick=()=>v.playbackRate=1;half.onclick=()=>v.playbackRate=.5;prev.onclick=()=>{v.pause();v.currentTime=Math.max(0,v.currentTime-1/30)};next.onclick=()=>{v.pause();v.currentTime+=1/30};seek.oninput=()=>{v.pause();v.currentTime=+seek.value};v.onloadedmetadata=()=>seek.max=v.duration;v.ontimeupdate=()=>{info.textContent=selected+' '+v.currentTime.toFixed(2)+'s / '+v.playbackRate+'倍';seek.value=v.currentTime};</script>
